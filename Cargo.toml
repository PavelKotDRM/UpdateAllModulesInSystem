[package]
name = "update_all_modules"
version = "0.4.7"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
egui = "0.36"
encoding_rs = "0.8"
is_elevated = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
thiserror = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
] }

[target.'cfg(not(windows))'.dependencies]
eframe = "0.36"

[build-dependencies]
# Подключаем vergen и активируем нужные фичи для сбора информации
vergen-gitcl = { version = "10", features = ["build", "cargo", "rustc", "si"] }
anyhow = "1.0"

[lints.rust]
missing_docs = "warn"

[lints.rustdoc]
all = { level = "warn", priority = -1 }
broken_intra_doc_links = "deny"